<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="#16408f" stroke-linecap="round" stroke-linejoin="round">
  <!-- TB-50 folding door pictogram: elevation (top) and plan view while folding (bottom) -->
  <!-- elevation: outer frame and 4 panels -->
  <rect x="40" y="52" width="212" height="140" stroke-width="3"/>
  <path d="M93 52v140M146 52v140M199 52v140" stroke-width="2"/>
  <!-- opening symbols (apex on the hinge side) -->
  <path d="M46 60 87 122 46 184M140 60 99 122 140 184M152 60 193 122 152 184M246 60 205 122 246 184" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- handle -->
  <path d="M87 115v14" stroke-width="3.4"/>
  <!-- plan: panels folding in accordion towards the left -->
  <path d="M40 222h212" stroke-width="1.4" stroke-dasharray="3 5"/>
  <path d="M40 222l22 30 22-30 22 30" stroke-width="4.5"/>
  <g fill="#16408f" stroke="none">
    <circle cx="40" cy="222" r="4"/><circle cx="62" cy="252" r="4"/><circle cx="84" cy="222" r="4"/><circle cx="106" cy="252" r="4"/>
  </g>
  <!-- movement arrow -->
  <path d="M236 240h-96M150 232l-10 8 10 8" stroke-width="2.6"/>
  <text x="40" y="282" font-family="monospace" font-size="14" fill="#16408f" stroke="none">TB-50 · MINIMAL FOLDING</text>
</svg>
