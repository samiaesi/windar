<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" stroke-linejoin="round">
  <!-- TB-50 minimal folding door: elevation with 3 leaves, hinges, handle and opening lines -->
  <!-- outer frame (double line) -->
  <rect x="40" y="34" width="214" height="214" fill="#eef3f9" stroke="#16233f" stroke-width="2.6"/>
  <rect x="45.5" y="39.5" width="203" height="203" fill="none" stroke="#16233f" stroke-width="1.2"/>

  <!-- leaves: sash profile + glass -->
  <g stroke="#16408f" stroke-width="1.3">
    <rect x="48" y="42" width="66" height="198" fill="#f4f7fb"/>
    <rect x="114" y="42" width="66" height="198" fill="#f4f7fb"/>
    <rect x="180" y="42" width="66" height="198" fill="#f4f7fb"/>
  </g>
  <g fill="#d3dfee" stroke="#5a7fb8" stroke-width="0.9">
    <rect x="55" y="49" width="52" height="184"/>
    <rect x="121" y="49" width="52" height="184"/>
    <rect x="187" y="49" width="52" height="184"/>
  </g>
  <!-- corner joints of the sashes -->
  <path d="M48 42l7 7M114 42l-7 7M48 240l7-7M114 240l-7-7M114 42l7 7M180 42l-7 7M114 240l7-7M180 240l-7-7M180 42l7 7M246 42l-7 7M180 240l7-7M246 240l-7-7" stroke="#5a7fb8" stroke-width="0.8"/>

  <!-- opening lines (the leaves fold in accordion) -->
  <g stroke="#d32f2f" stroke-width="1.3" fill="none">
    <path d="M55 49 107 233"/>
    <path d="M121 233 173 49"/>
    <path d="M187 49 239 233"/>
  </g>

  <!-- hinges: on the frame side and between the 2nd and 3rd leaf -->
  <g fill="#ffffff" stroke="#16233f" stroke-width="1.1">
    <rect x="45" y="84" width="6" height="20" rx="1"/>
    <rect x="45" y="182" width="6" height="20" rx="1"/>
    <rect x="177" y="84" width="6" height="20" rx="1"/>
    <rect x="177" y="182" width="6" height="20" rx="1"/>
    <!-- handle -->
    <rect x="240" y="130" width="5" height="22" rx="2"/>
  </g>

  <text x="40" y="282" font-family="monospace" font-size="14" fill="#16408f">TB-50 · MINIMAL FOLDING</text>
</svg>
