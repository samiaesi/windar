<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="#16408f" stroke-linecap="round" stroke-linejoin="round">
  <!-- TB-50 folding door pictogram: elevation (top) and plan view while folding (bottom) -->
  <!-- elevation: outer frame and 4 panels -->
  <rect x="70" y="50" width="260" height="140" stroke-width="3"/>
  <path d="M135 50v140M200 50v140M265 50v140" stroke-width="2"/>
  <!-- opening symbols (apex on the hinge side) -->
  <path d="M77 58 128 120 77 182M193 58 142 120 193 182M207 58 258 120 207 182M323 58 272 120 323 182" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- handle -->
  <path d="M128 113v14" stroke-width="3.4"/>
  <!-- plan: panels folding in accordion towards the left -->
  <path d="M70 222h260" stroke-width="1.4" stroke-dasharray="3 5"/>
  <path d="M70 222l28 34 28-34 28 34" stroke-width="4.5"/>
  <g fill="#16408f" stroke="none">
    <circle cx="70" cy="222" r="4"/><circle cx="98" cy="256" r="4"/><circle cx="126" cy="222" r="4"/><circle cx="154" cy="256" r="4"/>
  </g>
  <!-- movement arrow -->
  <path d="M318 244h-120M210 235l-12 9 12 9" stroke-width="2.6"/>
  <text x="330" y="286" text-anchor="end" font-family="monospace" font-size="14" fill="#16408f" stroke="none">TB-50 · FOLDING</text>
</svg>
