<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" stroke-linejoin="round">
  <!-- TB-25 slim sliding door: elevation with 2 sliding leaves meeting at a slim 25 mm interlock -->
  <!-- interlock dimension: 25 mm -->
  <g stroke="#16408f" fill="none">
    <path d="M144 44V24M152 44V24" stroke-width="1.1"/>
    <path d="M124 32h20M172 32h-20" stroke-width="1.3"/>
    <path d="M138 28l6 4-6 4M158 28l-6 4 6 4" stroke-width="1.3"/>
  </g>
  <text x="178" y="36.5" font-family="monospace" font-size="12.5" fill="#16408f">INTERLOCK 25 mm</text>

  <!-- outer frame (double line) -->
  <rect x="40" y="48" width="214" height="200" fill="#eef3f9" stroke="#16233f" stroke-width="2.6"/>
  <rect x="45.5" y="53.5" width="203" height="189" fill="none" stroke="#16233f" stroke-width="1.2"/>

  <!-- leaves: sash profile + glass -->
  <g stroke="#16408f" stroke-width="1.3">
    <rect x="48" y="56" width="100" height="184" fill="#f4f7fb"/>
    <rect x="148" y="56" width="98" height="184" fill="#f4f7fb"/>
  </g>
  <g fill="#d3dfee" stroke="#5a7fb8" stroke-width="0.9">
    <rect x="55" y="63" width="86" height="170"/>
    <rect x="155" y="63" width="84" height="170"/>
  </g>
  <path d="M48 56l7 7M48 240l7-7M246 56l-7 7M246 240l-7-7" stroke="#5a7fb8" stroke-width="0.8"/>
  <!-- slim interlock where the two leaves meet -->
  <rect x="144" y="54" width="8" height="188" rx="1.5" fill="#16233f"/>

  <!-- sliding directions -->
  <g stroke="#d32f2f" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M72 148h48M112 141l8 7-8 7"/>
    <path d="M222 148h-48M182 141l-8 7 8 7"/>
  </g>

  <!-- handles on the outer edges -->
  <g fill="#ffffff" stroke="#16233f" stroke-width="1.1">
    <rect x="49" y="136" width="5" height="24" rx="2"/>
    <rect x="240" y="136" width="5" height="24" rx="2"/>
  </g>

  <text x="40" y="282" font-family="monospace" font-size="14" fill="#16408f">TB-25 · SLIM SLIDING</text>
</svg>
